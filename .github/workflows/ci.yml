name: Courtside IQ checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research and process regression tests (required)
        run: |
          test -d research/tests
          test -n "$(find research/tests -name 'test_*.py' -print -quit)"
          PYTHONPATH=. python -m unittest discover -s research/tests -p 'test_*.py' -v
      - name: Website checks (only after website is imported)
        run: |
          if [ -d tests ]; then
            PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo '::notice::Website source and tests are not on this branch; website functionality is NOT verified by this run.'
          fi
